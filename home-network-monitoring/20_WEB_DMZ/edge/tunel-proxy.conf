<VirtualHost *:8080>
    ServerName sitio-ejemplo.duckdns.org
    DocumentRoot /var/www/html
    RemoteIPProxyProtocol On
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:8443>
    ServerName sitio-ejemplo.duckdns.org
    DocumentRoot /var/www/html
    RemoteIPProxyProtocol On
    SSLEngine on
    SSLCertificateFile /etc/ssl/sitio-ejemplo/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/sitio-ejemplo/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
</IfModule>